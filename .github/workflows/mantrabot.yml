name: MantraBot
on:
  schedule:
    - cron: "0 12 * * *"

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: echo "$(date)" >> mantra.log
      - run: |
          git config user.name "mantrabot[bot]"
          git config user.email "mantrabot@users.noreply.github.com"
          git add .
          git commit -m "MantraBot auto-update"
          git push
